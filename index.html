<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX CASHFLOW</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--ink:#0d1b2e;--mut:#5b6b80;--bg:#f5f7fa;--card:#fff;--line:#e3e8ef;--green:#0f9d6b;--amber:#d9822b;--red:#d64550;--blue:#2f6fed}
@media(prefers-color-scheme:dark){:root:not([data-l]){--ink:#e8eef7;--mut:#93a3b8;--bg:#0b1422;--card:#12203a;--line:#1f3050}}
:root[data-l=dark]{--ink:#e8eef7;--mut:#93a3b8;--bg:#0b1422;--card:#12203a;--line:#1f3050;color-scheme:dark}
:root[data-l=light]{color-scheme:light}
.tb{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;cursor:pointer}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:70px}
h1,h2,h3{margin:0}button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.02em}.logo b{color:var(--green)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);z-index:6;overflow-x:auto}
nav button{flex:1;min-width:64px;padding:12px 6px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer}
nav button.on{color:var(--green);box-shadow:inset 0 3px var(--green)}
main{max-width:1040px;margin:0 auto;padding:20px}
.hero{background:#0d1b2e;color:#fff;border-radius:18px;padding:28px 24px;margin-bottom:16px}
.hero p{margin:0;color:#9fb3cc}.hero .big{font-size:clamp(38px,9vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:6px 0}
.hero small{color:#9fb3cc}.hero em{font-style:normal;color:#ffb36b;font-weight:700}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.grid.k4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr!important}nav{position:static;border:0;border-bottom:1px solid var(--line);justify-content:center}nav button{flex:none;padding:12px 22px;box-shadow:none!important;border-bottom:3px solid transparent}nav button.on{border-color:var(--green)}body{padding:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;overflow-x:auto}
.kpi span{color:var(--mut);font-size:13px;font-weight:500}.kpi b{display:block;font-size:24px;letter-spacing:-.02em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row h2{flex:1;font-size:20px}
.btn{background:var(--green);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.s{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.r{background:var(--red)}.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
.row input,.row select{width:auto;flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;min-width:520px}th{text-align:left;color:var(--mut);font-size:13px;font-weight:500}
td,th{padding:10px 8px;border-bottom:1px solid var(--line)}td.a,th.a{text-align:right}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.Paid{background:#d9f5e8;color:#0a7a52}.Overdue{background:#fde0e2;color:#b32a35}.Due{background:#fdebd3;color:#a35a10}.Current{background:#dfe9fd;color:#1f4fb8}
dialog{border:0;border-radius:16px;padding:20px;width:min(720px,94vw);background:var(--card);color:var(--ink)}dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%}
.empty{text-align:center;color:var(--mut);padding:26px}
</style></head><body>
<div class="top"><div class="logo">APEX <b>CASHFLOW</b></div><div style="display:flex;gap:10px;align-items:center"><span id="mode" style="font-size:12px;color:var(--mut)"></span><button class="tb" id="tb" onclick="theme(document.documentElement.dataset.l=='dark'?'light':'dark')" aria-label="Switch light or dark mode"></button></div></div>
<nav id="nav"></nav><main id="app"></main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),T=new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $$=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const addD=(d,n)=>{const x=new Date(d+'T00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);
let S={customers:[],invoices:[]},view='dash',charts=[],ui={q:'',f:'all'};
const cfg=()=>{try{return JSON.parse(localStorage.getItem('apex_cfg'))||{}}catch(e){return{}}};
const uid=()=>Math.random().toString(36).slice(2,9);
function seed(){const c=[['Brightline Plumbing','ap@brightline.com'],['Harbor Café Group','owner@harborcafe.com'],['Summit Dental','billing@summitdental.com'],['Oakridge Builders','pay@oakridge.com']].map(x=>({id:uid(),name:x[0],email:x[1],phone:''}));
const i=[[0,1850,-20,-5,0],[0,920,-50,-35,0],[1,4200,-70,-40,0],[1,1300,-5,25,0],[2,2750,-12,3,0],[2,640,-30,-15,1],[3,12800,-100,-70,0],[3,5400,-40,-10,1],[2,980,-3,4,0],[0,1500,-80,-50,1]].map((x,n)=>({id:uid(),num:'INV-'+(1001+n),cid:c[x[0]].id,amt:x[1],issued:addD(T,x[2]),due:addD(T,x[3]),paid:x[4]?addD(T,x[3]+3):''}));
return{customers:c,invoices:i}}
async function api(body){const u=cfg().url;const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({...body,token:cfg().token})});return r.json()}
async function load(){const u=cfg().url;$('#mode').textContent=u?'Synced to Google Sheets':'Demo mode (this browser only)';
if(u){try{const d=await api({action:'load'});if(d.error)alert('Connected to your script, but the access token does not match the TOKEN in Script Properties.');else S={customers:d.customers||[],invoices:d.invoices||[]}}catch(e){alert('Could not reach your script ('+e.message+'). Check the Web App URL in Settings.')}}
else{const l=localStorage.getItem('apex_data');S=l?JSON.parse(l):seed()}}
async function save(){localStorage.setItem('apex_data',JSON.stringify(S));if(cfg().url)try{const r=await api({action:'save',data:S});if(r.error)alert('Saved in this browser only. Your access token does not match the TOKEN in Script Properties.')}catch(e){alert('Saved in this browser only ('+e.message+'). Check the Web App URL in Settings.')}render()}
const cust=id=>S.customers.find(c=>c.id==id)||{name:'(deleted)',email:''};
const od=i=>i.paid?0:Math.max(0,diff(T,i.due));
const st=i=>i.paid?'Paid':i.due<T?'Overdue':diff(i.due,T)<=7?'Due':'Current';
const stl=i=>({Due:'Due this week'}[st(i)]||st(i));
const P=i=>{try{const a=JSON.parse(i.pays||'[]');if(a.length)return a}catch(e){}return i.paid?[{d:i.paid,a:Number(i.amt)}]:[]},paidAmt=i=>P(i).reduce((s,p)=>s+Number(p.a),0),bal=i=>i.paid?0:Math.max(0,Number(i.amt)-paidAmt(i)),colSum=f=>S.invoices.flatMap(P).filter(p=>f(p.d)).reduce((s,p)=>s+Number(p.a),0);
const open=()=>S.invoices.filter(i=>!i.paid),sum=a=>a.reduce((s,i)=>s+bal(i),0);
const bucket=i=>{const d=od(i);return d==0?0:d<=30?1:d<=60?2:3};
function tmpl(i){const c=cust(i.cid),d=od(i),amt=$$(bal(i)),co=cfg().biz||'Our team';
let s,b;if(d<=7){s=`Friendly reminder: Invoice ${i.num} (${amt})`;b=`Hi ${c.name},\n\nJust a quick reminder that invoice ${i.num} for ${amt} ${d?'was due on':'is due on'} ${i.due}. If you've already sent payment, thank you! If not, please let us know when we can expect it.\n\nThanks,\n${co}`}
else if(d<=30){s=`Past due: Invoice ${i.num} (${amt}), ${d} days overdue`;b=`Hi ${c.name},\n\nOur records show invoice ${i.num} for ${amt} is now ${d} days past due (due ${i.due}). Please arrange payment this week, or reply if there's an issue we can help resolve.\n\nRegards,\n${co}`}
else{s=`Action required: Invoice ${i.num} is ${d} days overdue`;b=`Hi ${c.name},\n\nInvoice ${i.num} for ${amt} is ${d} days overdue and we have not received payment or a response. Please remit payment within 5 business days so we can avoid further collection steps.\n\nSincerely,\n${co}`}
return{s,b,to:c.email}}
function dlg(h){const d=$('#dlg');d.innerHTML=h;d.showModal()}
function followUp(id){const i=S.invoices.find(x=>x.id==id),t=tmpl(i);
dlg(`<h3>Payment follow-up</h3><label>To</label><input id="eto" value="${esc(t.to)}"><label>Subject</label><input id="esub" value="${esc(t.s)}"><label>Message</label><textarea id="eb" rows="9">${esc(t.b)}</textarea>
<div class="row" style="margin-top:14px"><button class="btn" onclick="sendMail('${id}')">${cfg().url?'Send via Gmail':'Open in email app'}</button><button class="btn s" onclick="dlg_.close()">Close</button></div>`)}
const dlg_=$('#dlg');
async function sendMail(id){const to=$('#eto').value,s=$('#esub').value,b=$('#eb').value;
if(cfg().url){const r=await api({action:'email',to,subject:s,body:b});alert(r.ok?'Email sent.':'Send failed.')}
else location.href=`mailto:${to}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`;
const i=S.invoices.find(x=>x.id==id);i.lastReminder=T;dlg_.close();save()}
function payForm(id){const i=S.invoices.find(x=>x.id==id);dlg(`<h3>Record payment</h3><p style="color:var(--mut)">${esc(i.num)} · ${esc(cust(i.cid).name)}<br>Invoice total ${$$(i.amt)} · Paid so far ${$$(paidAmt(i))} · <b>Balance ${$$(bal(i))}</b></p><label>Amount received ($)</label><input id="pa" type="number" min="0" step="0.01" value="${bal(i)}"><label>Payment date</label><input id="pd" type="date" value="${T}"><div class="row" style="margin-top:14px"><button class="btn" onclick="addPay('${id}')">Save payment</button><button class="btn s" onclick="dlg_.close()">Cancel</button></div>`)}
function addPay(id){const i=S.invoices.find(x=>x.id==id),a=+$('#pa').value,d=$('#pd').value;if(!a||a<=0)return alert('Enter the amount received.');if(a>bal(i)+.005)return alert('That is more than the balance due.');const L=P(i).slice();L.push({d,a});i.pays=JSON.stringify(L);i.paid=bal({...i,paid:''})<=.005?d:'';dlg_.close();save()}
function invForm(id){if(!S.customers.length){alert('Add a customer first.');return go('cust')}
const e=S.invoices.find(x=>x.id==id)||{};
dlg(`<h3>${id?'Edit':'New'} invoice</h3><label>Customer</label><select id="fc">${S.customers.map(c=>`<option value="${c.id}" ${c.id==e.cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
<label>Invoice #</label><input id="fn" value="${esc(e.num||'INV-'+(1001+S.invoices.length))}"><label>Amount ($)</label><input id="fa" type="number" min="0" step="0.01" value="${e.amt||''}">
<label>Issued</label><input id="fi" type="date" value="${e.issued||T}"><label>Due date</label><input id="fd" type="date" value="${e.due||addD(T,30)}">
<div class="row" style="margin-top:14px"><button class="btn" onclick="addInv('${id||''}')">Save invoice</button><button class="btn s" onclick="dlg_.close()">Cancel</button>${e.paid||(e.pays&&e.pays!='[]')?`<button class="btn s" onclick="unpay('${id}')">Clear payments</button>`:''}${id?`<button class="btn r" style="margin-left:auto" onclick="delInv('${id}')">Delete</button>`:''}</div>`)}
function addInv(id){const a=+$('#fa').value;if(!a)return alert('Enter an amount.');const v={num:$('#fn').value,cid:$('#fc').value,amt:a,issued:$('#fi').value,due:$('#fd').value};
if(id)Object.assign(S.invoices.find(x=>x.id==id),v);else S.invoices.push({id:uid(),...v,paid:''});dlg_.close();save()}
function delInv(id){if(confirm('Delete this invoice? This cannot be undone.')){S.invoices=S.invoices.filter(x=>x.id!=id);dlg_.close();save()}}
function unpay(id){const i=S.invoices.find(x=>x.id==id);i.paid='';i.pays='';dlg_.close();save()}
function custForm(id){const e=S.customers.find(c=>c.id==id)||{};dlg(`<h3>${id?'Edit':'New'} customer</h3><label>Name</label><input id="cn" value="${esc(e.name||'')}"><label>Email</label><input id="ce" type="email" value="${esc(e.email||'')}"><label>Phone</label><input id="cp" value="${esc(e.phone||'')}">
<div class="row" style="margin-top:14px"><button class="btn" onclick="addCust('${id||''}')">Save customer</button><button class="btn s" onclick="dlg_.close()">Cancel</button></div>`)}
function addCust(id){const n=$('#cn').value.trim();if(!n)return alert('Enter a name.');const v={name:n,email:$('#ce').value,phone:$('#cp').value};if(id)Object.assign(S.customers.find(c=>c.id==id),v);else S.customers.push({id:uid(),...v});dlg_.close();save()}
function delCust(id){if(S.invoices.some(i=>i.cid==id))return alert('This customer has invoices.');if(confirm('Delete customer?')){S.customers=S.customers.filter(c=>c.id!=id);save()}}
function csv(rows,name){const t=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click()}
const expInv=()=>csv([['Invoice','Customer','Amount','Issued','Due','Status','Days overdue','Paid on','Paid','Balance'],...S.invoices.map(i=>[i.num,cust(i.cid).name,i.amt,i.issued,i.due,st(i),od(i),i.paid,paidAmt(i),bal(i)])],'apex-invoices.csv');
const go=v=>{view=v;render()};
const NAV=[['dash','Dashboard'],['inv','Invoices'],['cust','Customers'],['age','Aging'],['hist','History'],['set','Settings']];
function invTable(list,fu=true){if(!list.length)return'<div class="empty">No invoices match.</div>';
return`<table><tr><th>Invoice</th><th>Customer</th><th>Due</th><th class="a">Amount</th><th>Status</th><th></th></tr>${list.map(i=>`<tr><td>${esc(i.num)}</td><td>${esc(cust(i.cid).name)}</td><td>${i.due}${od(i)?`<br><small style="color:var(--red)">${od(i)}d late</small>`:''}</td><td class="a">${$$(i.amt)}${paidAmt(i)&&!i.paid?`<br><small style="color:var(--mut)">Paid ${$$(paidAmt(i))} · Bal ${$$(bal(i))}</small>`:''}</td><td><span class="tag ${st(i)}">${stl(i)}</span></td><td class="a" style="white-space:nowrap"><button class="btn s sm" onclick="viewDoc('inv','${i.id}')">View</button> ${P(i).length?`<button class="btn s sm" onclick="viewDoc('rcpt','${i.id}',${P(i).length-1})">Receipt</button> `:''}${i.paid?'':`${fu?`<button class="btn s sm" onclick="followUp('${i.id}')">Follow up</button> `:''}<button class="btn sm" onclick="payForm('${i.id}')">Record payment</button>`} <button class="btn s sm" onclick="invForm('${i.id}')">Edit</button></td></tr>`).join('')}</table>`}
function render(){charts.forEach(c=>c.destroy());charts=[];const lg=cfg().logo;$('.logo').innerHTML=(lg?`<img src="${lg}" alt="logo" style="height:32px;max-width:120px;object-fit:contain;vertical-align:middle;margin-right:10px;background:#fff;padding:2px 6px;border-radius:8px">`:'')+'APEX <b>CASHFLOW</b>';$('#nav').innerHTML=NAV.map(n=>`<button class="${n[0]==view?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('');
const o=open(),over=o.filter(i=>i.due<T),wk=o.filter(i=>i.due>=T&&diff(i.due,T)<=7),m=T.slice(0,7),col=0;let h='';
if(view=='dash'){const worst=[...over].sort((a,b)=>od(b)-od(a));
h=`<div class="hero"><p>How much money are your customers currently holding?</p><div class="big">${$$(sum(o))}</div><small>${o.length} unpaid invoices · <em>${$$(sum(over))} is overdue</em></small></div>
<div class="grid k4"><div class="card kpi"><span>Outstanding</span><b>${$$(sum(o))}</b></div><div class="card kpi"><span>Overdue</span><b style="color:var(--red)">${$$(sum(over))}</b></div><div class="card kpi"><span>Due this week</span><b style="color:var(--amber)">${$$(sum(wk))}</b></div><div class="card kpi"><span>Collected this month</span><b style="color:var(--green)">${$$(colSum(d=>d.slice(0,7)==m))}</b></div></div>
<div class="grid g2"><div class="card"><h3>Cash flow</h3><div style="position:relative;height:260px"><canvas id="c1"></canvas></div></div><div class="card"><h3>AR aging</h3><div style="position:relative;height:260px"><canvas id="c2"></canvas></div></div></div>
<div class="card"><div class="row"><h3 style="flex:1">Chase these first</h3></div>${worst.length?invTable(worst.slice(0,5)):'<div class="empty">Nothing overdue. Nice work.</div>'}</div>`}
if(view=='inv'){let l=S.invoices.filter(i=>(ui.f=='all'||(ui.f=='Open'?!i.paid:st(i)==ui.f))&&(cust(i.cid).name+i.num).toLowerCase().includes(ui.q.toLowerCase())).sort((a,b)=>a.due<b.due?-1:1);
h=`<div class="row"><h2>Invoices</h2><button class="btn" onclick="invForm()">+ New invoice</button></div><div class="row"><input id="q" placeholder="Search customer or invoice #" value="${esc(ui.q)}" oninput="ui.q=this.value;keep()"><select onchange="ui.f=this.value;render()">${['all','Open','Overdue','Due','Current','Paid'].map(f=>`<option value="${f}" ${ui.f==f?'selected':''}>${f=='all'?'All statuses':f=='Due'?'Due this week':f}</option>`).join('')}</select></div><div class="card">${invTable(l)}</div>`}
if(view=='cust'){h=`<div class="row"><h2>Customers</h2><button class="btn" onclick="custForm()">+ New customer</button></div><div class="card">${S.customers.length?`<table><tr><th>Name</th><th>Email</th><th class="a">Owes you</th><th></th></tr>${S.customers.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td class="a">${$$(sum(o.filter(i=>i.cid==c.id)))}</td><td class="a" style="white-space:nowrap"><button class="btn s sm" onclick="viewDoc('stm','${c.id}')">Statement</button> <button class="btn s sm" onclick="custForm('${c.id}')">Edit</button> <button class="btn s sm" onclick="delCust('${c.id}')">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">Add your first customer to start tracking invoices.</div>'}</div>`}
if(view=='age'){const L=['Current','1-30 days','31-60 days','61-90+ days'],B=[0,0,0,0];o.forEach(i=>B[bucket(i)]+=bal(i));const t=sum(o)||1,C=['var(--blue)','var(--amber)','#e0603a','var(--red)'];
h=`<div class="row"><h2>AR aging</h2><button class="btn" onclick="viewDoc('age')">View aging report</button></div><div class="card">${L.map((n,k)=>`<div style="margin-bottom:14px"><div class="row" style="margin:0 0 4px"><b style="flex:1">${n}</b><b>${$$(B[k])}</b></div><div class="bar"><i style="width:${B[k]/t*100}%;background:${C[k]}"></i></div></div>`).join('')}</div>
${[1,2,3].map(k=>{const l=o.filter(i=>bucket(i)==k);return l.length?`<div class="card"><h3>${L[k]}</h3>${invTable(l)}</div>`:''}).join('')}`}
if(view=='hist'){const l=S.invoices.flatMap(i=>P(i).map((p,n)=>({...p,i,n}))).sort((a,b)=>a.d<b.d?1:-1);
h=`<div class="row"><h2>Payment history</h2><button class="btn s" onclick="csv([['Date','Invoice','Customer','Amount'],...S.invoices.flatMap(i=>P(i).map(p=>[p.d,i.num,cust(i.cid).name,p.a]))],'apex-payments.csv')">Export CSV</button></div><div class="card">${l.length?`<table><tr><th>Date</th><th>Invoice</th><th>Customer</th><th class="a">Amount</th><th></th></tr>${l.map(p=>`<tr><td>${p.d}</td><td>${esc(p.i.num)}</td><td>${esc(cust(p.i.cid).name)}</td><td class="a">${$$(p.a)}</td><td class="a"><button class="btn s sm" onclick="viewDoc('rcpt','${p.i.id}',${p.n})">Receipt</button></td></tr>`).join('')}</table>`:'<div class="empty">No payments yet. Record a payment on an invoice to see it here.</div>'}</div>`}
if(view=='set'){const c=cfg();h=`<div class="row"><h2>Settings & reports</h2></div><div class="card"><h3>Reports</h3><p style="color:var(--mut)">Download CSV files. In Google Sheets choose File → Import to open them.</p><button class="btn s" onclick="expInv()">Export all invoices</button></div>
<div class="card"><h3>Your business</h3><label>Business name (signs reminder emails)</label><input id="sb" value="${esc(c.biz||'')}"><label>Business address (shown on documents)</label><textarea id="sa" rows="2">${esc(c.addr||'')}</textarea><label>Business email / phone</label><input id="sm" value="${esc(c.bemail||'')}"><label>Logo (shown on invoices, receipts and statements)</label><input type="file" accept="image/*" onchange="setLogo(this)">${c.logo?`<div class="row" style="margin-top:8px"><img src="${c.logo}" style="max-height:48px;background:#fff;padding:4px;border-radius:6px"><button class="btn s sm" onclick="clearLogo()">Remove logo</button></div>`:''}
<h3 style="margin-top:18px">Google Sheets connection</h3><p style="color:var(--mut)">Paste the Web App URL from your Apps Script deployment. Leave empty to stay in demo mode.</p><label>Web App URL</label><input id="su" value="${esc(c.url||'')}" placeholder="https://script.google.com/macros/s/.../exec"><label>Access token (same as in Script Properties)</label><input id="st" value="${esc(c.token||'')}">
<div class="row" style="margin-top:14px"><button class="btn" onclick="saveCfg()">Save settings</button><button class="btn s" onclick="if(confirm('Reset demo data?')){localStorage.removeItem('apex_data');location.reload()}">Reset demo data</button></div></div>`}
$('#app').innerHTML=h;
if(view=='dash'){const ms=[];for(let k=-3;k<=2;k++){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+k);ms.push(d.toISOString().slice(0,7))}
const cs=Chart.defaults;cs.font.family="'Plus Jakarta Sans',system-ui";cs.maintainAspectRatio=false;cs.color=getComputedStyle(document.documentElement).getPropertyValue('--mut');
charts.push(new Chart($('#c1'),{type:'bar',data:{labels:ms.map(x=>new Date(x+'-15').toLocaleString('en-US',{month:'short'})),datasets:[{label:'Collected',backgroundColor:'#0f9d6b',data:ms.map(x=>colSum(d=>d.slice(0,7)==x))},{label:'Expected (unpaid, by due month)',backgroundColor:'#2f6fed',data:ms.map(x=>sum(o.filter(i=>(i.due<T&&x==m?true:i.due.slice(0,7)==x&&i.due>=T))))}]},options:{plugins:{legend:{position:'bottom'}}}}));
const B=[0,0,0,0];o.forEach(i=>B[bucket(i)]+=bal(i));
charts.push(new Chart($('#c2'),{type:'doughnut',data:{labels:['Current','1-30','31-60','61-90+'],datasets:[{data:B.some(v=>v>0)?B:[1],backgroundColor:B.some(v=>v>0)?['#2f6fed','#d9822b','#e0603a','#d64550']:['#8a9ab0'],borderWidth:0}]},options:{plugins:{legend:{position:'bottom'},tooltip:{enabled:B.some(v=>v>0)}}}}))}}
function keep(){const p=$('#q').selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(p,p)}
function readCfg(){return{...cfg(),biz:$('#sb').value,addr:$('#sa').value,bemail:$('#sm').value,url:$('#su').value.trim(),token:$('#st').value.trim()}}
function saveCfg(){localStorage.setItem('apex_cfg',JSON.stringify(readCfg()));location.reload()}
function setLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,320/im.width),cv=document.createElement('canvas');cv.width=im.width*s;cv.height=im.height*s;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const c=readCfg();c.logo=cv.toDataURL('image/png');localStorage.setItem('apex_cfg',JSON.stringify(c));render()};im.src=r.result};r.readAsDataURL(f)}
function clearLogo(){const c=readCfg();delete c.logo;localStorage.setItem('apex_cfg',JSON.stringify(c));render()}
const fdt=d=>d?d.slice(5,7)+'/'+d.slice(8,10)+'/'+d.slice(0,4):'';
const m2=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function docHTML(k,id,x0){const c=cfg(),i=(k=='stm'||k=='age')?null:S.invoices.find(x=>x.id==id),cu=k=='stm'?cust(id):k=='age'?{name:'',email:'',phone:''}:cust(i.cid);
const css='<style>body{font:13px/1.5 Arial,Helvetica,sans-serif;margin:26px;color:#111}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.r{text-align:right}.k{color:#666}.tot td{font-weight:bold;border-top:2px solid #111;border-bottom:0}.stamp{display:inline-block;border:3px solid #0f9d6b;color:#0f9d6b;font-weight:800;font-size:22px;padding:2px 14px;transform:rotate(-6deg);margin:8px 0}.box{display:flex;justify-content:space-between;gap:20px;margin-top:16px}</style>';
const title={inv:'INVOICE',rcpt:'RECEIPT',stm:'STATEMENT',age:'AR AGING'}[k];
const hd=`<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0f9d6b;padding-bottom:12px">
<div>${c.logo?`<img src="${c.logo}" style="max-height:56px;max-width:190px;display:block;margin-bottom:6px">`:''}<b style="font-size:17px">${esc(c.biz||'Your Business Name')}</b><div class="k" style="white-space:pre-line">${esc(c.addr||'')}${c.bemail?'<br>'+esc(c.bemail):''}</div></div>
<div style="font-size:28px;font-weight:800;letter-spacing:.05em;color:#0d1b2e">${title}</div></div>`;
const bill=`<div><div class="k">${k=='rcpt'?'RECEIVED FROM':k=='stm'?'STATEMENT FOR':'BILL TO'}</div><b>${esc(cu.name)}</b><div>${esc(cu.email)}</div><div>${esc(cu.phone||'')}</div></div>`;
let b='';
if(k=='inv'){const n=diff(i.due,i.issued),late=od(i),pa=paidAmt(i);b=`<div class="box">${bill}<table style="width:auto;margin:0"><tr><td class="k">Invoice #</td><td class="r"><b>${esc(i.num)}</b></td></tr><tr><td class="k">Invoice date</td><td class="r">${fdt(i.issued)}</td></tr><tr><td class="k">Due date</td><td class="r">${fdt(i.due)}</td></tr><tr><td class="k">Terms</td><td class="r">${n>0?'Net '+n:'Due on receipt'}</td></tr></table></div>
<table><tr><th>Description</th><th class="r">Amount</th></tr><tr><td>Services rendered</td><td class="r">${m2(i.amt)}</td></tr>${pa?`<tr><td class="r k">Payments received</td><td class="r">-${m2(pa)}</td></tr>`:''}<tr class="tot"><td class="r">${i.paid?'Balance due':'Amount due'}</td><td class="r">${m2(bal(i))}</td></tr></table>
${i.paid?`<div class="stamp">PAID ${fdt(i.paid)}</div>`:late?`<p style="color:#b32a35"><b>${late} days past due.</b> Please remit payment immediately.</p>`:`<p class="k">Please pay by ${fdt(i.due)}.</p>`}<p class="k">Thank you for your business.</p>`}
if(k=='rcpt'){const L=P(i),n=Math.max(0,Math.min(x0==null?L.length-1:x0,L.length-1)),p=L[n]||{d:T,a:0},cum=L.slice(0,n+1).reduce((s,q)=>s+Number(q.a),0),rem=Math.max(0,Number(i.amt)-cum);
b=`<div class="box">${bill}<table style="width:auto;margin:0"><tr><td class="k">Receipt #</td><td class="r"><b>RCPT-${esc(i.num)}-${n+1}</b></td></tr><tr><td class="k">Payment date</td><td class="r">${fdt(p.d)}</td></tr><tr><td class="k">Applied to</td><td class="r">Invoice ${esc(i.num)}</td></tr></table></div>
<div class="stamp" style="${rem>.005?'border-color:#d9822b;color:#d9822b':''}">${rem>.005?'PARTIAL PAYMENT':'PAID IN FULL'}</div><table><tr><th>Description</th><th class="r">Amount</th></tr><tr><td>Payment received for invoice ${esc(i.num)}</td><td class="r">${m2(p.a)}</td></tr><tr class="tot"><td class="r">Amount received</td><td class="r">${m2(p.a)}</td></tr></table>
<table style="width:auto;margin-left:auto"><tr><td class="k">Invoice total</td><td class="r">${m2(i.amt)}</td></tr><tr><td class="k">Total paid to date</td><td class="r">${m2(cum)}</td></tr><tr><td><b>Remaining balance</b></td><td class="r"><b>${m2(rem)}</b></td></tr></table><p class="k">Thank you for your payment.${rem>.005?' The remaining balance is due by '+fdt(i.due)+'.':''}</p>`}
if(k=='age'){const O=S.invoices.filter(x=>bal(x)>0).sort((a,b)=>od(b)-od(a)),L=['Current','1-30 days','31-60 days','61-90+ days'],A=[0,0,0,0];O.forEach(x=>A[bucket(x)]+=bal(x));
b=`<div class="box"><div><div class="k">REPORT DATE</div><b>${fdt(T)}</b></div><div style="text-align:right"><div class="k">TOTAL OUTSTANDING</div><b style="font-size:20px">${m2(sum(O))}</b></div></div>
<table><tr>${L.map(l=>`<th class="r">${l}</th>`).join('')}</tr><tr>${A.map(v=>`<td class="r"><b>${m2(v)}</b></td>`).join('')}</tr></table>
<table><tr><th>Customer</th><th>Invoice #</th><th>Due</th><th>Days overdue</th><th>Bucket</th><th class="r">Balance</th></tr>${O.map(x=>`<tr><td>${esc(cust(x.cid).name)}</td><td>${esc(x.num)}</td><td>${fdt(x.due)}</td><td>${od(x)||'-'}</td><td>${L[bucket(x)]}</td><td class="r">${m2(bal(x))}</td></tr>`).join('')||'<tr><td colspan="6" class="k">Nothing outstanding.</td></tr>'}<tr class="tot"><td colspan="5" class="r">Total outstanding</td><td class="r">${m2(sum(O))}</td></tr></table><p class="k">Aging is measured from each invoice due date.</p>`}
if(k=='stm'){const L=S.invoices.filter(x=>x.cid==id).sort((a,b)=>a.issued<b.issued?-1:1),O=L.filter(x=>!x.paid),A=[0,0,0,0];O.forEach(x=>A[bucket(x)]+=bal(x));
b=`<div class="box">${bill}<table style="width:auto;margin:0"><tr><td class="k">Statement date</td><td class="r">${fdt(T)}</td></tr><tr><td class="k">Balance due</td><td class="r"><b>${m2(sum(O))}</b></td></tr></table></div>
<table><tr><th>Invoice #</th><th>Date</th><th>Due</th><th>Status</th><th class="r">Amount</th><th class="r">Balance</th></tr>${L.map(x=>`<tr><td>${esc(x.num)}</td><td>${fdt(x.issued)}</td><td>${fdt(x.due)}</td><td>${x.paid?'Paid '+fdt(x.paid):od(x)?od(x)+' days overdue':'Open'}</td><td class="r">${m2(x.amt)}</td><td class="r">${m2(bal(x))}</td></tr>`).join('')||'<tr><td colspan="6" class="k">No invoices yet.</td></tr>'}<tr class="tot"><td colspan="5" class="r">Total balance due</td><td class="r">${m2(sum(O))}</td></tr></table>
<table><tr><th>Current</th><th>1-30 days</th><th>31-60 days</th><th>61-90+ days</th></tr><tr>${A.map(v=>`<td>${m2(v)}</td>`).join('')}</tr></table><p class="k">Please contact us with any questions about this statement.</p>`}
return'<!DOCTYPE html><html><head><meta charset="utf-8">'+css+'</head><body>'+hd+b+'</body></html>'}
function viewDoc(k,id,n){const i=k=='stm'?null:S.invoices.find(x=>x.id==id);let more='';
if(k=='inv'&&P(i).length)more=`<button class="btn s" onclick="viewDoc('rcpt','${id}',${P(i).length-1})">View receipt</button>`;
if(k=='rcpt')more=`<button class="btn s" onclick="viewDoc('inv','${id}')">View invoice</button>`+(P(i).length>1?P(i).map((p,j)=>`<button class="btn s sm" onclick="viewDoc('rcpt','${id}',${j})">Receipt ${j+1}</button>`).join(''):'');
dlg(`<iframe id="docf" style="width:100%;height:62vh;border:1px solid var(--line);border-radius:10px;background:#fff" srcdoc="${esc(docHTML(k,id,n))}"></iframe><div class="row" style="margin-top:12px"><button class="btn" onclick="document.getElementById('docf').contentWindow.print()">Print / Save as PDF</button>${more}<button class="btn s" onclick="dlg_.close()">Close</button></div>`)}
function theme(t){document.documentElement.dataset.l=t;try{localStorage.setItem('apex_theme',t)}catch(e){}$('#tb').textContent=t=='dark'?'☀ Light mode':'🌙 Dark mode';if($('#app').innerHTML)render()}
theme((()=>{try{return localStorage.getItem('apex_theme')}catch(e){}})()||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
load().then(render);
</script></body></html>
